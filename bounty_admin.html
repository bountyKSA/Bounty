<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة باونتي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{--green:#08745d;--green2:#1d9b78;--ink:#183c32;--muted:#718078;--line:#e3ebe5;--bg:#f6f8f4;--white:#fff;--red:#b54747;--gold:#a56d0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Arial,sans-serif;line-height:1.7}
button,input{font:inherit}.wrap{width:min(1100px,94%);margin:30px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}
h1{font-size:25px;margin:0;color:var(--green)}header p{margin:3px 0;color:var(--muted);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #173f3310}
.login{max-width:440px;margin:9vh auto}.field{display:grid;gap:6px;margin:13px 0}.field label{font-weight:700;font-size:13px}.field input{border:1px solid var(--line);border-radius:10px;padding:12px;direction:ltr;text-align:left}
.btn{border:0;border-radius:10px;padding:10px 17px;background:var(--green);color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.secondary{background:#edf4ef;color:var(--green)}.btn.reject{background:#fff0f0;color:var(--red)}.btn.logout{background:#f0f2ef;color:#53645b}
.hidden{display:none!important}.msg{font-size:13px;margin-top:12px;color:var(--red)}.muted{color:var(--muted)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0}
select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:white;color:var(--ink)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f3f7f3;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px}
.list{display:grid;gap:13px}.request{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.request-top{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.request h3{margin:0;color:var(--green);font-size:18px}.badge{border-radius:20px;padding:4px 10px;background:#fff4d9;color:var(--gold);font-size:12px;font-weight:700}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 18px;margin:13px 0;font-size:13px}.details b{color:#52645a}.description{background:#f8faf7;padding:10px;border-radius:9px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.empty{text-align:center;padding:35px;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:14px}
@media(max-width:600px){.wrap{margin:18px auto}.card{padding:16px}.details{grid-template-columns:1fr}h1{font-size:21px}}
</style>
</head>
<body>
<main class="wrap">
  <section id="loginCard" class="card login">
    <h1>🌿 إدارة باونتي</h1>
    <p class="muted">سجّلي الدخول بحساب المديرة لمراجعة طلبات التجار.</p>
    <form id="loginForm">
      <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required value="bounty.ksa@outlook.com"></div>
      <div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" id="loginBtn" type="submit">دخول لوحة التحكم</button>
      <div id="loginMsg" class="msg" role="alert"></div>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <header>
      <div><h1>🌿 لوحة إدارة باونتي</h1><p id="signedInAs"></p></div>
      <button class="btn logout" id="logoutBtn">تسجيل الخروج</button>
    </header>
    <div class="card">
      <div class="toolbar">
        <div class="stats"><span class="stat" id="totalCount">كل الطلبات: —</span><span class="stat" id="pendingCount">بانتظار المراجعة: —</span></div>
        <div><select id="statusFilter" aria-label="تصفية الطلبات"><option value="all">كل الطلبات</option><option value="pending">بانتظار المراجعة</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option></select> <button class="btn secondary" id="refreshBtn">تحديث</button></div>
      </div>
      <div id="requestsList" class="list"><div class="empty">جارٍ تحميل الطلبات...</div></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ikwmjhedttsnutkvdjmu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_359DzNNCBvFtFp3HaLZmBA_JQ9DFt5L';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let allRequests=[];

function safe(value){return String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function statusLabel(s){return ({pending:'بانتظار المراجعة',approved:'مقبول مبدئيًا',rejected:'مرفوض',pending_completion:'بانتظار استكمال البيانات',submitted_for_review:'مكتمل – بانتظار المراجعة',published:'منشور'})[s]||s||'غير محدد';}
function showLogin(message=''){$('loginCard').classList.remove('hidden');$('dashboard').classList.add('hidden');$('loginMsg').textContent=message;}
function showDashboard(email){$('loginCard').classList.add('hidden');$('dashboard').classList.remove('hidden');$('signedInAs').textContent='تم تسجيل الدخول: '+email;}

async function verifyAdmin(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){showLogin();return;}
  const {data,error:adminError}=await db.rpc('is_bounty_admin');
  if(adminError||data!==true){await db.auth.signOut();showLogin('هذا الحساب غير مخوّل لدخول لوحة الإدارة.');return;}
  showDashboard(user.email||'');
  await loadRequests();
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginBtn').disabled=true;$('loginMsg').textContent='جارٍ التحقق...';
  const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  $('loginBtn').disabled=false;
  if(error){$('loginMsg').textContent='تعذر تسجيل الدخول: '+error.message;return;}
  await verifyAdmin();
});
$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();showLogin('تم تسجيل الخروج.');});
$('refreshBtn').addEventListener('click',loadRequests);
$('statusFilter').addEventListener('change',renderRequests);

async function loadRequests(){
  $('requestsList').innerHTML='<div class="empty">جارٍ تحميل الطلبات...</div>';
  const {data,error}=await db.from('merchant_requests').select('*').order('created_at',{ascending:false});
  if(error){$('requestsList').innerHTML='<div class="empty">تعذر تحميل الطلبات. تحققي من سياسات RLS وصلاحية is_bounty_admin.</div>';console.error(error);return;}
  allRequests=data||[];
  $('totalCount').textContent='كل الطلبات: '+allRequests.length;
  $('pendingCount').textContent='بانتظار المراجعة: '+allRequests.filter(x=>x.status==='pending').length;
  renderRequests();
}
function renderRequests(){
 const filter=$('statusFilter').value;
 const rows=allRequests.filter(x=>filter==='all'||x.status===filter);
 if(!rows.length){$('requestsList').innerHTML='<div class="empty">لا توجد طلبات في هذا التصنيف حاليًا.</div>';return;}
 $('requestsList').innerHTML=rows.map(x=>`
  <article class="request">
   <div class="request-top"><h3>${safe(x.store_name||x.name||'طلب تاجر')}</h3><span class="badge">${safe(statusLabel(x.status))}</span></div>
   <div class="details">
    <div><b>اسم صاحب الطلب:</b> ${safe(x.owner_name)}</div><div><b>نوع النشاط:</b> ${safe(x.type)}</div>
    <div><b>المدينة:</b> ${safe(x.city)}</div><div><b>رقم التواصل:</b> ${safe(x.phone)}</div>
    <div><b>البريد:</b> ${safe(x.email)}</div><div><b>الموقع:</b> ${x.website?`<a href="${safe(x.website)}" target="_blank" rel="noopener">فتح الرابط</a>`:'—'}</div>
    <div><b>تاريخ الطلب:</b> ${safe(x.created_at?new Date(x.created_at).toLocaleString('ar-SA'):'—')}</div>
   </div>
   <div class="description">${safe(x.description)}</div>
   <div class="actions">
    ${x.status==='pending'?`<button class="btn" onclick="changeStatus('${safe(x.id)}','approved')">قبول مبدئي</button><button class="btn reject" onclick="changeStatus('${safe(x.id)}','rejected')">رفض الطلب</button>`:''}
   </div>
  </article>`).join('');
}
async function changeStatus(id,status){
 const label=status==='approved'?'قبول الطلب مبدئيًا':'رفض الطلب';
 if(!confirm('هل تريدين '+label+'؟'))return;
 const {error}=await db.from('merchant_requests').update({status}).eq('id',id);
 if(error){alert('لم يتم تحديث الحالة: '+error.message);return;}
 await loadRequests();
}
verifyAdmin();
</script>
</body>
</html>
